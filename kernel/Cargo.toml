# Independently builds the no_std KMDF/VHF kernel component; no GUI or floating point enters kernel mode.
[package]
name = "ctl460-vhf"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
wdk-sys = { version = "0.5.1", features = ["hid"] }
wdk-panic = "0.4"

[build-dependencies]
wdk-build = "0.5.1"

[package.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 33

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[workspace]
